; BBCSE rollback settings. Delete or rename this file to play with the game's normal netcode.
[net]
; steam = rollback in the game's own online matches (Network menu).
mode=steam
; Input delay in frames. 2 is a good start; raise it if the game rolls back a lot.
delay=2
; vsync=0: VSync off, the mod keeps the game at a steady 60 (recommended).
; vsync=1: keep VSync and the game's own frame limiter instead.
vsync=0

[display]
; These only work with vsync=0.
; Size the game draws at, normally your screen size (e.g. 1920 and 1080).
; 0 = the game's own 1280x768, stretched to your resolution.
renderwidth=0
renderheight=0
; borderless=1: with the game set to window mode, the window has no frame and covers the
; whole screen, so alt-tab is instant. Set the game's window resolution to your screen size.
borderless=0

[keys]
; Makes one key read as another, for keys the game won't let you bind.
; Write it as: key you press=key the game sees. Example: apostrophe=P
; then bind P in the game's key config and pressing ' does it.
