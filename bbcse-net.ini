; BBCSE rollback settings. Delete or rename this file to play with the game's normal netcode.
[net]
; steam = rollback in the game's own online matches (Network menu).
mode=steam
; Input delay in frames. 2 is a good start; raise it if the game rolls back a lot.
delay=2
; vsync=1 keeps VSync and the game's own frame limiter (default 0: the mod paces at 60).
;vsync=1
